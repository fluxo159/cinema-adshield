<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema AdShield</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="app-container">

        <!-- Header -->
        <header class="header">
            <div class="logo-group">
                <div class="shield-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                        <path d="M9 12l2 2 4-4" stroke="#00ff88" stroke-width="2.5"/>
                    </svg>
                </div>
                <div class="logo-text">
                    <h1>Cinema <span>AdShield</span></h1>
                    <p class="subtitle">Safari Extension</p>
                </div>
            </div>
            <label class="toggle-switch" title="Включить/выключить защиту">
                <input type="checkbox" id="mainToggle" checked>
                <span class="slider"></span>
            </label>
        </header>

        <!-- Status Banner -->
        <div id="statusBanner" class="status-banner active">🛡 Защита активна</div>

        <!-- Current Site Card -->
        <div class="site-card">
            <div class="site-info">
                <span class="site-label">Текущий сайт</span>
                <span class="site-domain" id="currentDomain">Загрузка...</span>
            </div>
            <button id="whitelistBtn" class="btn-whitelist" title="Отключить блокировку только для этого сайта">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
                </svg>
                <span>В белый список</span>
            </button>
        </div>

        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-value" id="pageBlockedCount">0</div>
                <div class="stat-title">На странице</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="totalBlockedCount">0</div>
                <div class="stat-title">Всего заблокировано</div>
            </div>
        </div>

        <!-- Reset Button -->
        <button id="resetBtn" class="btn-reset" title="Сбросить счётчик">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12">
                <polyline points="1 4 1 10 7 10"></polyline>
                <path d="M3.51 15a9 9 0 1 0 .49-4.5"></path>
            </svg>
            Сбросить счётчик
        </button>

        <!-- Action: Element Zapper -->
        <div class="action-section">
            <button id="zapperBtn" class="btn-zapper">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15">
                    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                </svg>
                <span>Заппер элементов</span>
            </button>
            <p class="zapper-hint">Кликните на любой баннер для мгновенного удаления</p>
        </div>

        <!-- Shield Status List -->
        <div class="features-list">
            <div class="feature-item">
                <span class="feature-dot active"></span>
                <span class="feature-name">Авто-очистка баннеров</span>
                <span class="feature-status">ВКЛ</span>
            </div>
            <div class="feature-item">
                <span class="feature-dot active"></span>
                <span class="feature-name">Блокировка попандеров</span>
                <span class="feature-status">ВКЛ</span>
            </div>
            <div class="feature-item">
                <span class="feature-dot active"></span>
                <span class="feature-name">Пропуск пре-роллов</span>
                <span class="feature-status">ВКЛ</span>
            </div>
            <div class="feature-item">
                <span class="feature-dot active"></span>
                <span class="feature-name">YouTube AdShield</span>
                <span class="feature-status">ВКЛ</span>
            </div>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <span>Cinema AdShield v2.0 • Safari Edition</span>
        </footer>
    </div>

    <script src="popup.js"></script>
</body>
</html>
